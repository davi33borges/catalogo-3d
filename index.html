<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111216; --card:#1b1d24; --line:#2a2d37; --txt:#eceef3; --muted:#9aa0ae;
    --accent:#ff7a3d; --accent2:#ffb38a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:40px 40px;background-attachment:fixed}
  body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at top,transparent 0%,var(--bg) 70%);pointer-events:none;z-index:-1}
  header{max-width:1200px;margin:0 auto;padding:56px 24px 24px}
  .tag{display:inline-block;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);
    border:1px solid var(--accent);padding:4px 10px;border-radius:4px;margin-bottom:16px}
  h1{font-size:clamp(32px,6vw,56px);line-height:1;font-weight:700}
  h1 span{color:var(--accent)}
  header p{color:var(--muted);margin-top:12px;font-size:18px}
  .bar{max-width:1200px;margin:0 auto;padding:16px 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;
    position:sticky;top:0;background:rgba(17,18,22,.85);backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--line)}
  .search{flex:1;min-width:220px;background:var(--card);border:1px solid var(--line);color:var(--txt);
    padding:12px 16px;border-radius:8px;font:inherit;font-size:15px}
  .search:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:999px;
    cursor:pointer;font:inherit;font-size:14px;transition:.15s}
  .chip:hover{color:var(--txt)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#111}
  .folder{color:var(--accent2);text-decoration:none;font-size:14px;margin-left:auto}
  main{max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;
    transition:transform .2s,border-color .2s}
  .card:hover{transform:translateY(-4px);border-color:var(--accent)}
  .thumb{aspect-ratio:4/3;background:#0c0d10;cursor:zoom-in;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
  .card:hover .thumb img{transform:scale(1.05)}
  .body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .cat{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .body h3{font-size:18px}
  .body p{color:var(--muted);font-size:14px;line-height:1.45;flex:1}
  .dl{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#111;
    text-decoration:none;font-weight:700;padding:12px;border-radius:8px;transition:.15s}
  .dl:hover{background:var(--accent2)}
  .dl.off{background:var(--line);color:var(--muted);pointer-events:none}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:40px 24px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:20;padding:24px;cursor:zoom-out}
  .modal.on{display:flex}
  .modal img{max-width:100%;max-height:90vh;border-radius:8px}
</style>
</head>
<body>

<header>
  <div class="tag">Impressão 3D · STL</div>
  <h1 id="titulo">Catálogo <span>3D</span></h1>
  <p id="subtitulo"></p>
</header>

<div class="bar">
  <input class="search" id="busca" type="search" placeholder="Buscar projeto...">
  <div class="chips" id="chips"></div>
  <a class="folder" id="pasta" target="_blank" rel="noopener" hidden>Ver pasta no Drive ↗</a>
</div>

<main id="grade"></main>
<footer id="rodape"></footer>

<div class="modal" id="modal"><img id="modalImg" alt=""></div>

<script>
  // carrega a lista sempre atualizada (evita cache do GitHub Pages)
  const _s=document.createElement("script"); _s.src="projetos.js?v="+Date.now(); _s.onload=()=>iniciar(); document.head.appendChild(_s);
  function iniciar(){
  // Converte link de compartilhamento do Drive em link de download direto
  function linkDownload(url){
    if(!url) return "";
    const m = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
    if(!m || m[1].includes("COLE_O_ID")) return "";
    return "https://drive.google.com/uc?export=download&id=" + m[1];
  }
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // Cabeçalho
  const t = CONFIG.titulo || "Catálogo 3D";
  const partes = t.split(" ");
  document.getElementById("titulo").innerHTML = partes.length > 1
    ? esc(partes.slice(0,-1).join(" ")) + " <span>" + esc(partes.at(-1)) + "</span>" : esc(t);
  document.title = t;
  document.getElementById("subtitulo").textContent = CONFIG.subtitulo || "";
  if(CONFIG.pastaDrive){ const p=document.getElementById("pasta"); p.href=CONFIG.pastaDrive; p.hidden=false; }

  // Mais recentes primeiro
  const lista = [...PROJETOS].sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const cats = ["Todos", ...new Set(lista.map(p=>p.categoria).filter(Boolean))];
  let catAtual = "Todos";

  const chips = document.getElementById("chips");
  cats.forEach(c=>{
    const b=document.createElement("button"); b.className="chip"+(c==="Todos"?" on":""); b.textContent=c;
    b.onclick=()=>{catAtual=c; chips.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b)); render();};
    chips.appendChild(b);
  });
  if(cats.length<=2) chips.hidden = true;

  function render(){
    const q = document.getElementById("busca").value.trim().toLowerCase();
    const itens = lista.filter(p =>
      (catAtual==="Todos" || p.categoria===catAtual) &&
      (!q || (p.nome+" "+(p.descricao||"")+" "+(p.categoria||"")).toLowerCase().includes(q)));
    const g = document.getElementById("grade");
    g.innerHTML = itens.length ? itens.map(p=>{
      const dl = linkDownload(p.drive);
      return `<article class="card">
        <div class="thumb" data-img="${esc(p.imagem)}"><img src="${esc(p.imagem)}" alt="${esc(p.nome)}" loading="lazy"></div>
        <div class="body">
          ${p.categoria?`<div class="cat">${esc(p.categoria)}</div>`:""}
          <h3>${esc(p.nome)}</h3>
          <p>${esc(p.descricao)}</p>
          <a class="dl${dl?"":" off"}" href="${dl||"#"}" target="_blank" rel="noopener">
            ${dl?"⬇ Baixar .zip":"Em breve"}</a>
        </div></article>`;
    }).join("") : `<div class="empty">Nenhum projeto encontrado.</div>`;
    document.getElementById("rodape").textContent = `${lista.length} projeto(s) no catálogo`;
  }
  document.getElementById("busca").addEventListener("input", render);

  // Ampliar imagem
  const modal=document.getElementById("modal");
  document.getElementById("grade").addEventListener("click",e=>{
    const t=e.target.closest(".thumb"); if(!t) return;
    document.getElementById("modalImg").src=t.dataset.img; modal.classList.add("on");
  });
  modal.onclick=()=>modal.classList.remove("on");
  render();
  }
</script>
</body>
</html>
