<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111216">
<title>Catálogo 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111216; --card:#1b1d24; --line:#2a2d37; --txt:#eceef3; --muted:#9aa0ae;
    --accent:#ff7a3d; --accent2:#ffb38a;
    --pad:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:40px 40px;background-attachment:fixed}
  body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at top,transparent 0%,var(--bg) 70%);pointer-events:none;z-index:-1}
  body.travado{overflow:hidden}
  button{font:inherit;color:inherit}

  /* ---------- Cabeçalho ---------- */
  header{max-width:1200px;margin:0 auto;padding:56px var(--pad) 24px;position:relative}
  .admin{position:absolute;top:20px;right:var(--pad);display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;
    font-size:13px;border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px;transition:.15s}
  .admin:hover{color:var(--accent);border-color:var(--accent)}
  .tag{display:inline-block;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);
    border:1px solid var(--accent);padding:4px 10px;border-radius:4px;margin-bottom:16px}
  h1{font-size:clamp(28px,6vw,56px);line-height:1.05;font-weight:700}
  h1 span{color:var(--accent)}
  header p{color:var(--muted);margin-top:12px;font-size:clamp(15px,2.2vw,18px);max-width:640px}

  /* ---------- Barra de busca / filtros ---------- */
  .bar{position:sticky;top:0;z-index:5;background:rgba(17,18,22,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar-in{max-width:1200px;margin:0 auto;padding:14px var(--pad);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .menu-btn{display:none;flex:none;width:46px;height:46px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;
    align-items:center;justify-content:center;position:relative}
  .menu-btn svg{width:22px;height:22px}
  .menu-btn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .search{flex:1 1 260px;min-width:220px;background:var(--card);border:1px solid var(--line);color:var(--txt);
    padding:12px 16px;border-radius:8px;font:inherit;font-size:16px;height:46px}
  .search:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:999px;
    cursor:pointer;font-size:14px;transition:.15s;white-space:nowrap}
  .chip:hover{color:var(--txt)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#111}
  .folder{color:var(--accent2);text-decoration:none;font-size:14px;margin-left:auto;white-space:nowrap}
  .filtro{display:none}

  /* ---------- Grade ---------- */
  main{max-width:1200px;margin:0 auto;padding:var(--pad);display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;
    transition:transform .2s,border-color .2s}
  .thumb{aspect-ratio:4/3;background:#0c0d10;cursor:zoom-in;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s;display:block}
  @media (hover:hover){
    .card:hover{transform:translateY(-4px);border-color:var(--accent)}
    .card:hover .thumb img{transform:scale(1.05)}
  }
  .body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .cat{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .body h3{font-size:18px;line-height:1.25}
  .body p{color:var(--muted);font-size:14px;line-height:1.45;flex:1}
  .dl{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#111;
    text-decoration:none;font-weight:700;padding:12px;border-radius:8px;transition:.15s;text-align:center}
  .dl:hover{background:var(--accent2)}
  .dl.off{background:var(--line);color:var(--muted);pointer-events:none}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:32px var(--pad) calc(32px + env(safe-area-inset-bottom))}

  /* ---------- Imagem ampliada ---------- */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:40;padding:16px;cursor:zoom-out}
  .modal.on{display:flex}
  .modal img{max-width:100%;max-height:90vh;border-radius:8px}

  /* ---------- Menu lateral (celular) ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--card);border-right:1px solid var(--line);z-index:31;
    transform:translateX(-100%);transition:transform .28s ease;display:flex;flex-direction:column;
    padding:calc(16px + env(safe-area-inset-top)) 0 calc(16px + env(safe-area-inset-bottom))}
  body.menu-aberto .overlay{opacity:1;pointer-events:auto}
  body.menu-aberto .drawer{transform:none}
  .drawer-top{display:flex;align-items:center;justify-content:space-between;padding:0 16px 14px;border-bottom:1px solid var(--line)}
  .drawer-top strong{font-size:18px}
  .drawer-top strong span{color:var(--accent)}
  .fechar{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:20px;line-height:1}
  .drawer h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:18px 16px 8px}
  .cat-list{flex:1;overflow-y:auto;padding:0 8px}
  .cat-item{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:transparent;border:0;
    padding:12px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--txt)}
  .cat-item small{color:var(--muted);font-size:13px}
  .cat-item.on{background:rgba(255,122,61,.14);color:var(--accent)}
  .cat-item.on small{color:var(--accent)}
  .drawer-links{border-top:1px solid var(--line);padding:12px 8px 0;display:flex;flex-direction:column;gap:4px}
  .drawer-links a{display:flex;align-items:center;gap:10px;padding:12px;border-radius:8px;color:var(--txt);text-decoration:none;font-size:15px}
  .drawer-links a:hover{background:rgba(255,255,255,.04)}

  /* ---------- Tablet ---------- */
  @media (max-width:1023px){
    main{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  }

  /* ---------- Celular ---------- */
  @media (max-width:767px){
    :root{--pad:14px}
    header{padding:22px var(--pad) 16px}
    header .admin{display:none}
    .tag{font-size:10px;margin-bottom:10px}
    header p{margin-top:8px}
    .bar-in{padding:10px var(--pad);gap:10px;flex-wrap:nowrap}
    .menu-btn{display:flex}
    .search{flex:1 1 auto;min-width:0}
    .chips,.folder{display:none!important}
    .filtro{display:flex;align-items:center;gap:8px;max-width:1200px;margin:0 auto;padding:0 var(--pad) 10px}
    .filtro button{display:inline-flex;align-items:center;gap:8px;background:rgba(255,122,61,.14);color:var(--accent);
      border:1px solid rgba(255,122,61,.4);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
    main{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .card{border-radius:10px}
    .body{padding:10px;gap:5px}
    .cat{font-size:9.5px;letter-spacing:.1em}
    .body h3{font-size:14px}
    .body p{font-size:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .dl{font-size:13px;padding:10px 6px;margin-top:6px}
  }
  @media (max-width:340px){
    main{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header>
  <a class="admin" href="admin.html" title="Área do administrador">🔒 Admin</a>
  <div class="tag">Impressão 3D · STL</div>
  <h1 id="titulo">Catálogo <span>3D</span></h1>
  <p id="subtitulo"></p>
</header>

<div class="bar">
  <div class="bar-in">
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menu" aria-controls="drawer" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span class="dot" id="menuDot" hidden></span>
    </button>
    <input class="search" id="busca" type="search" placeholder="Buscar projeto..." enterkeyhint="search">
    <div class="chips" id="chips"></div>
    <a class="folder" id="pasta" target="_blank" rel="noopener" hidden>Ver pasta no Drive ↗</a>
  </div>
  <div class="filtro" id="filtro" hidden><button id="filtroBtn"></button></div>
</div>

<main id="grade"></main>
<footer id="rodape"></footer>

<!-- Menu lateral (celular) -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-top">
    <strong id="drawerTitulo">Catálogo <span>3D</span></strong>
    <button class="fechar" id="fecharBtn" aria-label="Fechar menu">✕</button>
  </div>
  <h4>Categorias</h4>
  <div class="cat-list" id="catList"></div>
  <div class="drawer-links">
    <a id="pastaMob" target="_blank" rel="noopener" hidden>📁 Ver pasta no Drive</a>
    <a href="admin.html">🔒 Área do admin</a>
  </div>
</aside>

<div class="modal" id="modal"><img id="modalImg" alt=""></div>

<script>
  // carrega a lista sempre atualizada (evita cache do GitHub Pages)
  const _s=document.createElement("script"); _s.src="projetos.js?v="+Date.now(); _s.onload=()=>iniciar(); document.head.appendChild(_s);

  function iniciar(){
  const $ = id => document.getElementById(id);
  // Converte link de compartilhamento do Drive em link de download direto
  function linkDownload(url){
    if(!url) return "";
    const m = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
    if(!m || m[1].includes("COLE_O_ID")) return "";
    return "https://drive.google.com/uc?export=download&id=" + m[1];
  }
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // Cabeçalho
  const t = CONFIG.titulo || "Catálogo 3D";
  const partes = t.split(" ");
  const tituloHtml = partes.length > 1 ? esc(partes.slice(0,-1).join(" ")) + " <span>" + esc(partes.at(-1)) + "</span>" : esc(t);
  $("titulo").innerHTML = tituloHtml; $("drawerTitulo").innerHTML = tituloHtml;
  document.title = t;
  $("subtitulo").textContent = CONFIG.subtitulo || "";
  if(CONFIG.pastaDrive){ ["pasta","pastaMob"].forEach(id=>{ $(id).href=CONFIG.pastaDrive; $(id).hidden=false; }); }

  // Mais recentes primeiro
  const lista = [...PROJETOS].sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const contagem = {}; lista.forEach(p=>{ if(p.categoria) contagem[p.categoria]=(contagem[p.categoria]||0)+1; });
  const cats = ["Todos", ...Object.keys(contagem)];
  let catAtual = "Todos";

  // Filtros: chips (computador/tablet) e lista do menu lateral (celular)
  $("chips").innerHTML = cats.map(c=>`<button class="chip" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  $("catList").innerHTML = cats.map(c=>`<button class="cat-item" data-cat="${esc(c)}">${esc(c)} <small>${c==="Todos"?lista.length:contagem[c]}</small></button>`).join("");
  if(cats.length<=2) $("chips").hidden = true;

  function escolher(c){
    catAtual = c;
    document.querySelectorAll("[data-cat]").forEach(b=>b.classList.toggle("on", b.dataset.cat===c));
    $("filtro").hidden = c==="Todos";
    $("filtroBtn").textContent = c + "  ✕";
    $("menuDot").hidden = c==="Todos";
    render();
  }
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ escolher(b.dataset.cat); if(b.classList.contains("cat-item")) fecharMenu(); });
  $("filtroBtn").onclick = ()=>escolher("Todos");

  // Menu lateral
  function abrirMenu(){ document.body.classList.add("menu-aberto","travado"); $("menuBtn").setAttribute("aria-expanded","true"); $("drawer").setAttribute("aria-hidden","false"); }
  function fecharMenu(){ document.body.classList.remove("menu-aberto","travado"); $("menuBtn").setAttribute("aria-expanded","false"); $("drawer").setAttribute("aria-hidden","true"); }
  $("menuBtn").onclick = ()=> document.body.classList.contains("menu-aberto") ? fecharMenu() : abrirMenu();
  $("fecharBtn").onclick = fecharMenu;
  $("overlay").onclick = fecharMenu;
  document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ fecharMenu(); $("modal").classList.remove("on"); } });
  matchMedia("(min-width:768px)").addEventListener("change", e=>{ if(e.matches) fecharMenu(); });
  // arrastar para a esquerda fecha o menu
  let x0=null;
  $("drawer").addEventListener("touchstart", e=>{ x0=e.touches[0].clientX; }, {passive:true});
  $("drawer").addEventListener("touchend", e=>{ if(x0!==null && x0-e.changedTouches[0].clientX>60) fecharMenu(); x0=null; });

  function render(){
    const q = $("busca").value.trim().toLowerCase();
    const itens = lista.filter(p =>
      (catAtual==="Todos" || p.categoria===catAtual) &&
      (!q || (p.nome+" "+(p.descricao||"")+" "+(p.categoria||"")).toLowerCase().includes(q)));
    $("grade").innerHTML = itens.length ? itens.map(p=>{
      const dl = linkDownload(p.drive);
      return `<article class="card">
        <div class="thumb" data-img="${esc(p.imagem)}"><img src="${esc(p.imagem)}" alt="${esc(p.nome)}" loading="lazy"></div>
        <div class="body">
          ${p.categoria?`<div class="cat">${esc(p.categoria)}</div>`:""}
          <h3>${esc(p.nome)}</h3>
          <p>${esc(p.descricao)}</p>
          <a class="dl${dl?"":" off"}" href="${dl||"#"}" target="_blank" rel="noopener">
            ${dl?"⬇ Baixar .zip":"Em breve"}</a>
        </div></article>`;
    }).join("") : `<div class="empty">Nenhum projeto encontrado.</div>`;
    $("rodape").textContent = `${lista.length} projeto(s) no catálogo`;
  }
  $("busca").addEventListener("input", render);

  // Ampliar imagem
  const modal=$("modal");
  $("grade").addEventListener("click",e=>{
    const t=e.target.closest(".thumb"); if(!t) return;
    $("modalImg").src=t.dataset.img; modal.classList.add("on");
  });
  modal.onclick=()=>modal.classList.remove("on");
  escolher("Todos");
  }
</script>
</body>
</html>
